<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A tactile map of found and created attention." />
    <title>Attention Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="atlas" aria-label="Attention Atlas interactive map">
      <canvas id="grid" aria-hidden="true"></canvas>

      <header class="topbar">
        <nav aria-label="Main navigation">
          <a class="wordmark" href="#" aria-label="Return to the center">Atlas</a>
          <button class="nav-button" data-view="index">Index</button>
        </nav>
        <div class="zoom-control" aria-label="Zoom controls">
          <button id="zoom-out" aria-label="Zoom out">−</button>
          <input id="zoom" type="range" min="65" max="160" value="100" aria-label="Map zoom" />
          <button id="zoom-in" aria-label="Zoom in">+</button>
        </div>
      </header>

      <section id="artifacts" aria-label="Atlas artifacts"></section>

      <div class="edge-axis horizontal-axis">
        <span>Found</span>
        <div class="axis-range horizontal-range">
          <span class="arrow left-arrow">‹</span>
          <input id="horizontal-position" type="range" min="-100" max="100" value="0" aria-label="Position between Found and Created" />
          <span class="arrow right-arrow">›</span>
        </div>
        <span>Created</span>
      </div>

      <div class="edge-axis vertical-axis">
        <span>Active Focus</span>
        <div class="axis-range vertical-range">
          <span class="arrow up-arrow">↑</span>
          <input id="vertical-position" type="range" min="-100" max="100" value="0" aria-label="Position between Passing Interest and Active Focus" />
          <span class="arrow down-arrow">↓</span>
        </div>
        <span>Passing Interest</span>
      </div>

      <button id="recenter" class="recenter" aria-label="Return to the center" title="Return to center">⌖</button>
      <aside id="index-panel" class="index-panel" aria-hidden="true">
        <div class="index-heading">
          <h1>Index</h1>
          <button id="close-index" aria-label="Close index">Close</button>
        </div>
        <p class="index-intro">Everything currently held in the atlas.</p>
        <ol id="index-list"></ol>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
